sonar.projectKey=TechSpherex
sonar.projectName=TechSpherex Clean Architecture
sonar.projectVersion=2.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=src/**/bin/**,src/**/obj/**,**/*.g.cs,**/*.generated.cs,**/Migrations/**
sonar.test.exclusions=src/**/bin/**,src/**/obj/**

# Coverage (Coverlet Cobertura format)
sonar.coverageReportPaths=TestResults/coverage/coverage.cobertura.xml
sonar.coverage.exclusions=src/**/bin/**,src/**/obj/**,**/*.g.cs,**/*.generated.cs
