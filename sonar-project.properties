# SonarQube configuration for TechSpherex.CleanArchitecture
# Token is injected at scan time via /sonar:token argument

sonar.projectKey=TechSpherex-CleanArchitecture
sonar.projectName=TechSpherex CleanArchitecture
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.inclusions=**/*.cs
sonar.exclusions=**/bin/**,**/obj/**,**/*.Designer.cs,**/*.g.cs,**/*.g.i.cs,**/Migrations/**

sonar.sourceEncoding=UTF-8
sonar.language=cs
sonar.dotnet.buildScope=full

sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
